name: Windows executable
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone Windows GUI
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name MotionClickStudio --icon assets/motionclick.ico --collect-all soundcard --collect-all scipy --collect-all pynput app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/MotionClickStudio -DestinationPath dist/MotionClickStudio-Windows.zip -CompressionLevel Optimal
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotionClickStudio-Windows
          path: dist/MotionClickStudio-Windows.zip
          if-no-files-found: error
      - name: Publish versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MotionClickStudio-Windows.zip
          generate_release_notes: true
